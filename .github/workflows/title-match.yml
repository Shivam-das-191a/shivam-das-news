name: Title match (old Blogger redirects)
# Every day: find posts with the SAME title on the old Blogger blog and on the site, and keep the pairs for life.
# A change is committed to the branch, which starts the normal deploy. Entries are only ever added (PLAN 32).
on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: content-writer
  cancel-in-progress: false
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Match titles
        working-directory: site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/title-match.mjs
      - name: Commit when something changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add site/config/title-redirects.json site/blogger/redirect-snippet.html
          if git diff --cached --quiet; then echo "No change."; else git commit -m "Title match: update old Blogger redirects" && git push; fi
