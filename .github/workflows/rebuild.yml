name: Hourly rebuild
# Keeps the news sitemap (48 h window) and active categories (7 days) fresh (BUGS S5, H3).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        run: curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
