name = "news-analytics"
main = "index.js"
compatibility_date = "2026-01-01"

# Every hour at minute 5: hourly and daily totals, then delete raw events older than 7 days (BUGS N5).
[triggers]
crons = ["5 * * * *"]

[vars]
ALLOWED_USERS = ""   # REQUIRED for the dashboard numbers (GET /stats): GitHub logins that may read them, for example "shivam-das". Empty = nobody can read.
SITE_ORIGIN = "https://YOUR-DOMAIN"   # the only website that may send visits, for example https://yourdomain.com (same https:// and host, no slash at the end)

# v0.74.0 (BOT_PROTECTION Part 3c): the kill switch. "true", "1", "yes" or "on" makes POST /collect and GET /stamp answer 503 at once (nothing is counted; no deploy needed).
# It does not touch the dashboard numbers (GET /stats) or the trending block (GET /trending). Use it during an attack, then set it back to "false".
COLLECT_OFF = "false"

# The D1 database. Create it once:  npx wrangler d1 create news-analytics   then copy the database_id it prints.
# Then apply the tables once:       npx wrangler d1 execute news-analytics --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "news-analytics"
database_id = "YOUR-DATABASE-ID"

# Optional rate limit per session id (BUGS N6). Without it the endpoint still works, with no limit here.
# Check the current syntax in the Cloudflare docs ("Rate Limiting binding") before you switch it on:
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }
# v0.74.0: POST /collect needs a signed stamp from GET /stamp. One secret (a long random text, 40 or more characters; make it with: openssl rand -hex 32):
#   cd workers/analytics ; npx wrangler secret put STAMP_SECRET
# Without it /collect and GET /stamp answer 503 and nothing is counted. Never write it in this file. Each Worker has its own STAMP_SECRET (a stamp of one Worker is no good for another).
# Deploy: cd workers/analytics ; npx wrangler deploy
